<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Event Kasse" />
  <title>Event Kasse</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div>
      <h1>Event Kasse</h1>
      <p>Barverkauf für Veranstaltungen</p>
    </div>
    <button id="settingsBtn" class="secondary">Produkte</button>
  </header>

  <main>
    <section class="panel">
      <h2>Artikel</h2>
      <div id="productGrid" class="product-grid"></div>
      <div id="emptyProducts" class="empty hidden">
        Noch keine Produkte angelegt.
      </div>
    </section>

    <section class="panel">
      <div class="row-between">
        <h2>Bestellung</h2>
        <button id="clearCartBtn" class="ghost">Leeren</button>
      </div>

      <div id="cart"></div>
      <div id="emptyCart" class="empty">Noch nichts ausgewählt.</div>

      <div class="totals">
        <div><span>Waren</span><strong id="goodsTotal">0,00 €</strong></div>
        <div><span>Pfand</span><strong id="depositTotal">0,00 €</strong></div>
        <div class="grand-total"><span>Gesamt</span><strong id="grandTotal">0,00 €</strong></div>
      </div>
    </section>

    <section class="panel payment">
      <h2>Barzahlung</h2>
      <label for="cashGiven">Gegeben</label>
      <div class="money-input">
        <input id="cashGiven" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00" />
        <span>€</span>
      </div>

      <div class="quick-cash">
        <button data-cash="5">5 €</button>
        <button data-cash="10">10 €</button>
        <button data-cash="20">20 €</button>
        <button data-cash="50">50 €</button>
      </div>

      <div class="change-box">
        <span>Rückgeld</span>
        <strong id="changeAmount">0,00 €</strong>
      </div>

      <button id="finishSaleBtn" class="primary full">Verkauf abschließen</button>
    </section>
  </main>

  <dialog id="productDialog">
    <form method="dialog" class="dialog-card">
      <div class="row-between">
        <h2>Produkte verwalten</h2>
        <button value="cancel" class="ghost">Schließen</button>
      </div>

      <div id="productList" class="product-list"></div>

      <hr />

      <h3>Neues Produkt</h3>
      <label>
        Name
        <input id="productName" type="text" maxlength="40" placeholder="z. B. Bier" />
      </label>
      <label>
        Preis (€)
        <input id="productPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="3,50" />
      </label>
      <label>
        Pfand (€)
        <input id="productDeposit" type="number" min="0" step="0.01" inputmode="decimal" placeholder="1,00" />
      </label>
      <button id="addProductBtn" type="button" class="primary full">Produkt hinzufügen</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
